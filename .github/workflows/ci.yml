name: VoiceType CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libxkbcommon0 libegl1 libopengl0 \
            libfontconfig1 libfreetype6 libglib2.0-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        # Single line + single quotes: PowerShell (windows-latest) chokes on
        # backslash continuations and double-quoted -o values. Single quotes
        # are safe in both pwsh and bash.
        run: pytest -q -o 'addopts=--cov=src/voicetype --cov-report=term-missing' --cov-report=xml:coverage-${{ matrix.os }}-py${{ matrix.python }}.xml --cov-report=html:htmlcov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage-${{ matrix.os }}-py${{ matrix.python }}.xml
            htmlcov/
