[project]
name = "voicetype"
version = "1.0.0"
description = "VoiceType - voice-first keyboard replacement (macOS/Windows/Linux)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["voice", "dictation", "speech-to-text", "whisper", "accessibility"]
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "sounddevice>=0.4.6",
  "numpy>=1.24",
  "faster-whisper>=1.0.0",
  "openwakeword>=0.5.1",
  "onnxruntime>=1.16",
  "PySide6>=6.6",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
mac = ["pyobjc-framework-Quartz>=10", "pyobjc-framework-AppKit>=10"]
windows = ["pywin32>=306", "uiautomation>=2.0"]
linux = ["evdev>=1.6", "python-uinput>=1.0"]
test = ["pytest>=7", "pytest-cov>=5", "pytest-asyncio>=0.23"]
companion = ["websockets>=12", "cryptography>=41", "zeroconf>=0.47", "qrcode>=7"]

[project.urls]
Homepage = "https://github.com/seraphonixstudios/Voice-type-"
Documentation = "https://github.com/seraphonixstudios/Voice-type-/blob/main/docs/WHITEPAPER.md"
Issues = "https://github.com/seraphonixstudios/Voice-type-/issues"

[project.scripts]
voicetype = "voicetype.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/voicetype --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src/voicetype"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "^\\s*pass\\s*(#.*)?$",
]
